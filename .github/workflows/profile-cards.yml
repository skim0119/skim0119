name: Update profile cards

on:
  push:
    paths:
      - .github/workflows/profile-cards.yml
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-cards-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Generate stats
        uses: stats-organization/github-readme-stats-action@v2.1.0
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&theme=dark&role=OWNER,ORGANIZATION_MEMBER,COLLABORATOR
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Generate top languages
        uses: stats-organization/github-readme-stats-action@v2.1.0
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=dark&size_weight=0.5&count_weight=0.5&hide=Makefile&role=OWNER,ORGANIZATION_MEMBER,COLLABORATOR
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/top-langs.svg
          if ! git diff --cached --quiet; then
            git commit -m "Update profile cards"
            git push
          fi
